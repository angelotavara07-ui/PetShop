<div class="pet-form-page">
  <form #petForm="ngForm" (ngSubmit)="onSubmit(petForm)" class="pet-form card" novalidate>
    <h2 class="pet-form__title">Registro de Mascotas</h2>

    <div class="form-group">
      <label for="nombre">Nombre <span class="required">*</span></label>
      <input
        type="text"
        id="nombre"
        name="nombre"
        placeholder="Ej. Luna"
        [(ngModel)]="mascota.nombre"
        #nombre="ngModel"
        required
        minlength="2"
        [class.is-invalid]="nombre.invalid && nombre.touched"
      />
      <span class="error-msg" *ngIf="nombre.invalid && nombre.touched">
        <span *ngIf="nombre.errors?.['required']">El nombre es obligatorio.</span>
        <span *ngIf="nombre.errors?.['minlength']">Debe tener al menos 2 caracteres.</span>
      </span>
    </div>

    <div class="form-group">
      <label for="especie">Especie <span class="required">*</span></label>
      <select
        id="especie"
        name="especie"
        [(ngModel)]="mascota.especie"
        #especie="ngModel"
        required
        [class.is-invalid]="especie.invalid && especie.touched"
      >
        <option value="" disabled selected>Selecciona especie</option>
        <option *ngFor="let e of especies" [value]="e">{{ e }}</option>
      </select>
      <span class="error-msg" *ngIf="especie.invalid && especie.touched">
        Selecciona una especie.
      </span>
    </div>

    <div class="form-group">
      <label for="raza">Raza <span class="required">*</span></label>
      <input
        type="text"
        id="raza"
        name="raza"
        placeholder="Ej. Golden Retriever"
        [(ngModel)]="mascota.raza"
        #raza="ngModel"
        required
        [class.is-invalid]="raza.invalid && raza.touched"
      />
      <span class="error-msg" *ngIf="raza.invalid && raza.touched">
        La raza es obligatoria.
      </span>
    </div>

    <div class="form-row">
      <div class="form-group form-group--edad">
        <label for="edad">Edad <span class="required">*</span></label>
        <div class="input-with-suffix">
          <input
            type="number"
            id="edad"
            name="edad"
            placeholder="Ej. 2"
            [(ngModel)]="mascota.edad"
            #edad="ngModel"
            required
            min="0"
            max="30"
            [class.is-invalid]="edad.invalid && edad.touched"
          />
          <span class="suffix">años</span>
        </div>
        <span class="error-msg" *ngIf="edad.invalid && edad.touched">
          <span *ngIf="edad.errors?.['required']">La edad es obligatoria.</span>
          <span *ngIf="edad.errors?.['min'] || edad.errors?.['max']">Ingresa una edad válida.</span>
        </span>
      </div>

      <div class="form-group form-group--sexo">
        <label>Sexo <span class="required">*</span></label>
        <div class="radio-group" #sexo="ngModel" [(ngModel)]="mascota.sexo" name="sexo" required>
          <label class="radio-option">
            <input type="radio" name="sexo" value="Macho" [(ngModel)]="mascota.sexo" />
            Macho
          </label>
          <label class="radio-option">
            <input type="radio" name="sexo" value="Hembra" [(ngModel)]="mascota.sexo" />
            Hembra
          </label>
        </div>
        <span class="error-msg" *ngIf="sexo.invalid && sexo.touched">
          Selecciona el sexo.
        </span>
      </div>
    </div>

    <div class="pet-form__actions">
      <button type="submit" class="btn-primary">Registrar</button>
      <button type="button" class="btn-secondary" (click)="onLimpiar(petForm)">Limpiar</button>
    </div>

    <p class="pet-form__success" *ngIf="mensaje">{{ mensaje }}</p>
  </form>

  <aside class="pet-preview card">
    <img src="assets/img/pet-preview.jpg" alt="Mascota en adopción" class="pet-preview__img" />
    <i class="fa-solid fa-paw pet-preview__icon"></i>
    <p class="pet-preview__text">Tu mascota merece un gran hogar</p>
  </aside>
</div>
